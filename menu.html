<script src="assets/js/i18n.js"></script>
<script src="assets/js/menu-data.js"></script>
<script>
(function () {
  const cols = document.getElementById("menu-cols");
  const nav = document.getElementById("cat-nav");
  const search = document.getElementById("menu-search");
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const norm = (s) => s.toLowerCase().replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي");

  function render() {
    const ar = NILE.lang === "ar";
    const q = norm(search.value.trim());
    nav.innerHTML = NILE_MENU.map((c) => `<a href="#${c.id}">${c.icon} ${ar ? c.ar : c.en}</a>`).join("");
    const cards = NILE_MENU.map((c) => {
      const items = c.items.filter(([a, e]) => !q || norm(a).includes(q) || norm(e).includes(q));
      if (!items.length) return "";
      return `<section class="menu-card ${c.color}" id="${c.id}">
        <h2><span aria-hidden="true">${c.icon}</span>${ar ? c.ar : c.en}</h2>
        <ul class="price-list">${items.map(([a, e, p]) =>
          `<li><span>${esc(ar ? a : e)}<br><span class="alt">${esc(ar ? e : a)}</span></span><span class="dots"></span><span class="price">${p}</span></li>`
        ).join("")}</ul></section>`;
    }).join("");
    cols.innerHTML = cards || `<p class="menu-empty">${NILE.t("mp.empty")}</p>`;
    spy();
    if (first && location.hash) {
      first = false;
      const t = document.getElementById(location.hash.slice(1));
      if (t) t.scrollIntoView();
    }
  }
  let first = true;

  let io;
  function spy() {
    if (io) io.disconnect();
    if (!("IntersectionObserver" in window)) return;
    io = new IntersectionObserver((entries) => entries.forEach((en) => {
      if (!en.isIntersecting) return;
      nav.querySelectorAll("a").forEach((a) => {
        const on = a.getAttribute("href") === "#" + en.target.id;
        a.classList.toggle("active", on);
        if (on) a.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
      });
    }), { rootMargin: "-160px 0px -60% 0px" });
    cols.querySelectorAll(".menu-card").forEach((el) => io.observe(el));
  }

  I18N.ar["mp.page"] = "المنيو | نايل ستون كافيه";
  I18N.en["mp.page"] = "Menu | Nile Stone Café";
  search.addEventListener("input", render);
  document.addEventListener("nile:lang", render);
})();
</script>
</body>
</html>
